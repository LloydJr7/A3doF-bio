<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutores - Clínica Veterinária</title>
    <link rel="stylesheet" href="../css/tutores.css">
    <script src="../js/auth.js"></script>
    <script src="../js/tutores.js" defer></script>
</head>
<body>

    <a href="index.html" class="voltar-inicio">← Voltar ao Início</a>

    <header>
        <h1>🐾 Clínica Veterinária</h1>
        <p>Sistema de Gerenciamento de Tutores e Endereços</p>
    </header>

    <main>
        <div id="mensagem-alerta" class="alerta" style="display: none;"></div>

        <section>
            <h2 id="titulo-form">Cadastrar Tutor</h2>

            <form id="form-tutor">
                <input type="hidden" id="tutor-id-edicao">

                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required>

                <div class="linha-dupla">
                    <div>
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div>
                        <label for="data-nascimento">Data de Nascimento:</label>
                        <input type="date" id="data-nascimento" required>
                    </div>
                </div>

                <div class="linha-dupla">
                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" required>
                    </div>
                    <div>
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" placeholder="(21) 99999-9999" required>
                    </div>
                </div>

                <div class="grupo-cep">
                    <div>
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" maxlength="9" placeholder="00000-000" required>
                    </div>
                    <button type="button" id="btn-buscar-cep">Buscar CEP</button>
                </div>

                <input type="hidden" id="endereco-id" required>

                <div class="linha-dupla">
                    <div>
                        <label for="logradouro">Logradouro:</label>
                        <input type="text" id="logradouro" placeholder="Rua / Avenida">
                    </div>
                    <div>
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" placeholder="Bairro">
                    </div>
                </div>

                <div class="linha-dupla">
                    <div>
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" placeholder="Cidade">
                    </div>
                    <div>
                        <label for="uf">UF:</label>
                        <input type="text" id="uf" maxlength="2" placeholder="RJ">
                    </div>
                </div>

                <div class="botoes-form">
                    <button type="submit" id="btn-salvar">Cadastrar Tutor</button>
                    <button type="button" id="btn-cancelar-edicao" class="btn-secundario" style="display: none;">Cancelar Edição</button>
                </div>
            </form>
        </section>

        <section>
            <h2>Tutores Cadastrados</h2>

            <button type="button" id="btn-atualizar">Atualizar Lista</button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome Completo</th>
                        <th>CPF</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>End. ID</th>
                        <th>Situação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-tutores"></tbody>
            </table>
        </section>
    </main>

</body>
</html>
