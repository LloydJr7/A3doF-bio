
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais - Clínica Veterinária</title>
    <link rel="stylesheet" href="../css/animais.css">
    <script src="../js/animais.js" defer></script>
</head>
<body>

<a href="index.html" class="voltar-inicio">
    ← Voltar ao Início
</a>


    <header>
        <h1>🐾 Clínica Veterinária</h1>
        <p>Sistema de Gerenciamento de Animais</p>
    </header>

    <main>
        <section>
            <h2>Cadastrar Animal</h2>

            <form id="form-animal">
                <label for="nome">Nome do animal:</label>
                <input type="text" id="nome" required>

                
                <label for="especie">Espécie:</label>
                <select id="especie" required>
                    <option value="">Selecione uma espécie</option>
                    <option value="1">Cachorro</option>
                    <option value="2">Gato</option>
                </select>

                <label for="raca">Raça:</label>
                <select id="raca" required>
                    <option value="">Selecione uma raça</option>
                </select>


                <label for="tutor">ID do tutor:</label>
                <input type="number" id="tutor" min="1">

                <label for="sexo">Sexo:</label>
                <select id="sexo">
                    <option value="">Selecione</option>
                    <option value="Macho">Macho</option>
                    <option value="Femea">Fêmea</option>
                </select>

                <label for="cor">Cor:</label>
                <input type="text" id="cor">

                <label for="peso">Peso atual (kg):</label>
                <input type="number" id="peso" min="0.01" step="0.01">

                <button type="submit">Cadastrar Animal</button>
            </form>
        </section>

        <section>
            <h2>Animais Cadastrados</h2>

            <button type="button" id="btn-atualizar">
                Atualizar Lista
            </button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Espécie</th>
                        <th>Raça</th>
                        <th>Tutor</th>
                        <th>Sexo</th>
                        <th>Cor</th>
                        <th>Peso</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista-animais">
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
